; Пример настроек. Скопируйте в config.ini и заполните.
; Комментарии только с начала строки: символы ; и # в значениях сохраняются как есть.
; Значение можно заключить в двойные кавычки.

[config]
; Адрес REST API
listen=0.0.0.0:8080
; Ключ доступа службы к REST API (Authorization: Bearer ...), минимум 16 символов
api_token=replace-me-api-token

[telegram]
; Токен от @BotFather
bot_token=123456:replace-me
; Необязательно: Telegram ID пользователя-исключения. Ему доступен /start без ссылки регистрации.
; developer_id=123456789
; Лимиты Telegram: ~30 сообщений/с на бота, ~1 сообщение/с в один чат
global_rate=25
chat_interval=1s

[database]
host = "localhost"
port = 5432
name = "postman"
user = "postman"
; Зашифрованный пароль в формате {HEX} (TangleText из Autils.pas, скобки обязательны)
; либо пароль как есть
password = "postman"
; Необязательно: disable | prefer | require | verify-ca | verify-full. По умолчанию prefer.
; sslmode = require

[connect]
; Общий секрет бота и регистрирующей службы, минимум 32 байта
link_shared_secret=replace-me-with-at-least-32-random-bytes
; Срок действия ссылок регистрации, выдаваемых через API по умолчанию
link_ttl=24h
; Адрес службы для режима callback: бот выдаст пользователю <callback_url>?code=...
; Без него режим callback отключён.
; callback_url=https://service.example.com/telegram/callback
; callback_ttl=10m

[alerts]
; Сколько алерт актуален; недоставленный за это время получает статус expired. 0 — бессрочно.
message_ttl=1h
; Сколько хранить завершённые сообщения, считая от создания; более старые удаляются вместе
; со статусом доставки. Без этого параметра или при 0 сообщения хранятся всегда.
message_retention=720h

[send-queue]
queue_workers=8
queue_max_attempts=10
queue_poll_interval=1s
