# Обратный прокси к REST API бота. Установка описана в deploy/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name blindpostman.dsstalker.online;

    # 308, а не 301: клиент обязан повторить POST, а не превратить его в GET.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blindpostman.dsstalker.online;

    ssl_certificate     /etc/letsencrypt/live/blindpostman.dsstalker.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blindpostman.dsstalker.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;

    # Столько же принимает само API (maxBodySize в internal/api/api.go).
    client_max_body_size 64k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    # Чуть больше requestTimeout приложения (30 с): ответит оно, а не nginx.
    proxy_read_timeout 35s;

    location /api/ {
        # Если адреса служб постоянны, разрешите только их:
        # allow 203.0.113.10;
        # deny all;

        proxy_pass http://192.168.0.212:8080;
    }

    # Swagger UI, открыт без токена. Запрос к /doc nginx сам перенаправит на /doc/.
    location /doc/ {
        proxy_pass http://192.168.0.212:8080;
    }

    # Наружу отдаются только API и документация. /healthz доступен мониторингу напрямую
    # по внутреннему адресу.
    location / {
        return 404;
    }
}
